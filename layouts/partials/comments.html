{{- /* Comments via giscus (GitHub Discussions) */ -}}
<div id="giscus-container"></div>
<script>
  (function () {
    // Initial theme follows PaperMod's toggle (html[data-theme]).
    var pref = localStorage.getItem("pref-theme");
    var isDark = pref === "dark" ||
      (!pref && document.documentElement.dataset.theme === "dark");

    var s = document.createElement("script");
    s.src = "https://giscus.app/client.js";
    s.setAttribute("data-repo", "corentin-core/corentin-core.github.io");
    s.setAttribute("data-repo-id", "R_kgDORZTnzQ");
    s.setAttribute("data-category", "Announcements");
    s.setAttribute("data-category-id", "DIC_kwDORZTnzc4DBZAC");
    s.setAttribute("data-mapping", "pathname");
    s.setAttribute("data-strict", "1");
    s.setAttribute("data-reactions-enabled", "1");
    s.setAttribute("data-emit-metadata", "0");
    s.setAttribute("data-input-position", "top");
    s.setAttribute("data-theme", isDark ? "dark" : "light");
    s.setAttribute("data-lang", "en");
    s.crossOrigin = "anonymous";
    s.async = true;
    document.getElementById("giscus-container").appendChild(s);

    // Keep giscus in sync when the reader toggles the site theme.
    var toggle = document.getElementById("theme-toggle");
    if (toggle) {
      toggle.addEventListener("click", function () {
        var dark = document.documentElement.dataset.theme === "dark";
        var frame = document.querySelector("iframe.giscus-frame");
        if (!frame) return;
        frame.contentWindow.postMessage(
          { giscus: { setConfig: { theme: dark ? "dark" : "light" } } },
          "https://giscus.app"
        );
      });
    }
  })();
</script>
