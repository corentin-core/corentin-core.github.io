<style>
  .mermaid {
    text-align: center;
    background: transparent !important;
  }
</style>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: true, theme: 'dark' });
</script>

<script>
  // Scrollspy for the side table of contents: highlight the section
  // currently near the top of the viewport. No-op when #toc-side is absent.
  (function () {
    const toc = document.getElementById("toc-side");
    if (!toc) return;

    const entries = [];
    toc.querySelectorAll('a[href^="#"]').forEach((a) => {
      const id = decodeURIComponent(a.getAttribute("href").slice(1));
      const heading = document.getElementById(id);
      if (heading) entries.push({ heading, link: a });
    });
    if (entries.length === 0) return;

    let active = null;
    const setActive = (link) => {
      if (link === active) return;
      if (active) active.classList.remove("active");
      if (link) link.classList.add("active");
      active = link;
    };

    // Active section = the last heading whose top has crossed a line 20% down
    // the viewport. A single threshold keeps the choice monotonic while
    // scrolling, so no back-and-forth flicker between adjacent sections.
    const update = () => {
      const line = window.innerHeight * 0.2;
      if (entries[0].heading.getBoundingClientRect().top > line) {
        setActive(null); // still above the first heading
        return;
      }
      let current = entries[0].link;
      for (const { heading, link } of entries) {
        if (heading.getBoundingClientRect().top <= line) current = link;
        else break;
      }
      setActive(current);
    };

    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        update();
        ticking = false;
      });
    };

    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll, { passive: true });
    update();
  })();
</script>
